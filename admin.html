<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandup · Admin</title><link rel="icon" type="image/svg+xml" href="bandup-icon.svg"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=7"></head><body><main><h2 data-i="adm"></h2><p class="tag" id="status" aria-live="polite"></p><div class="card"><table id="tb"></table></div></main><script src="i18n2.js?v=5"></script><script src="i18n3.js?v=5"></script><script src="app.js?v=9"></script><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const table=document.getElementById("tb"),status=document.getElementById("status");
async function draw(){status.textContent=t("adminLoading");try{const {users}=await api("/api/admin/users");table.innerHTML="<tr><th>"+t("name")+"</th><th>"+t("pts")+"</th><th></th></tr>"+(users.length?users.map(u=>"<tr><td>"+esc(u.name)+(u.role==="admin"?" · admin":"")+"</td><td>"+Number(u.points||0)+"</td><td>"+(u.role==="student"?'<button class="btn ghost" data-id="'+esc(u.id)+'" data-name="'+esc(u.name)+'" data-d="10">+10</button> <button class="btn ghost" data-id="'+esc(u.id)+'" data-name="'+esc(u.name)+'" data-d="-10">−10</button> <button class="btn ghost" data-id="'+esc(u.id)+'" data-name="'+esc(u.name)+'" data-delete="1">'+t("deleteAccount")+'</button>':"")+"</td></tr>").join(""):"<tr><td colspan='3'>"+t("noStudents")+"</td></tr>");status.textContent=""}catch(e){table.innerHTML="";status.textContent=e.status===403?t("adminDenied"):t("saveError")}}
table.onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.delete&&!confirm(t("confirmDelete",{n:b.dataset.name})))return;b.disabled=true;try{if(b.dataset.delete)await api("/api/admin/users/"+encodeURIComponent(b.dataset.id),{method:"DELETE",body:"{}"});else await api("/api/admin/users/"+encodeURIComponent(b.dataset.id)+"/points",{method:"PATCH",body:JSON.stringify({delta:Number(b.dataset.d)})});await draw()}catch(err){status.textContent=err.message||t("saveError");b.disabled=false}};
BANDUP_SESSION_READY.then(()=>draw());
</script></body></html>
