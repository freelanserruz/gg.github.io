<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam prep</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main><h2 data-i="adm"></h2><p class="tag" data-i="admn"></p><div class="card"><table id="tb"></table></div></main><script src="app.js"></script><script>
function draw(){const u=users();tb.innerHTML="<tr><th>"+t("name")+"</th><th>"+t("pts")+"</th><th></th></tr>"+Object.entries(u).map(([n,p])=>"<tr><td>"+n.replace(/</g,"&lt;")+"</td><td>"+p+'</td><td><button class="btn ghost" data-n="'+encodeURIComponent(n)+'" data-d="10">+10</button> <button class="btn ghost" data-n="'+encodeURIComponent(n)+'" data-d="-10">−10</button></td></tr>').join("")}
tb.onclick=e=>{const b=e.target.closest("button");if(!b)return;const u=users(),n=decodeURIComponent(b.dataset.n);u[n]=Math.max(0,(u[n]||0)+ +b.dataset.d);save("ep_users",u);draw()};draw();
</script></body></html>
