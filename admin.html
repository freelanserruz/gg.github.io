<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandup</title><link rel="icon" type="image/svg+xml" href="bandup-icon.svg"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=6"></head><body><main><h2 data-i="adm"></h2><p class="tag" data-i="admn"></p><div class="card"><table id="tb"></table></div></main><script src="i18n2.js?v=5"></script><script src="i18n3.js?v=5"></script><script src="app.js?v=8"></script><script>
function draw(){const u=users();tb.innerHTML="<tr><th>"+t("name")+"</th><th>"+t("pts")+"</th><th></th></tr>"+Object.entries(u).map(([n,p])=>"<tr><td>"+n.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</td><td>"+p+'</td><td><button class="btn ghost" data-n="'+encodeURIComponent(n)+'" data-d="10">+10</button> <button class="btn ghost" data-n="'+encodeURIComponent(n)+'" data-d="-10">−10</button> <button class="btn ghost" data-n="'+encodeURIComponent(n)+'" data-delete="1">'+t("deleteAccount")+'</button></td></tr>').join("")}
tb.onclick=e=>{const b=e.target.closest("button");if(!b)return;const u=users(),n=decodeURIComponent(b.dataset.n);if(b.dataset.delete){if(!confirm(t("confirmDelete",{n})))return;delete u[n];save("ep_users",u);if(me()&&me().name===n){try{localStorage.removeItem("ep_user");localStorage.removeItem("ep_flow");localStorage.removeItem("ep_flow_en");localStorage.removeItem("ep_flow_ielts");localStorage.removeItem("ep_active_course");localStorage.removeItem("ep_resume")}catch{}}draw();return}u[n]=Math.max(0,(u[n]||0)+ +b.dataset.d);save("ep_users",u);draw()};draw();
</script></body></html>
