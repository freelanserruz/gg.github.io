<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandup · Владелец сайта</title><link rel="icon" type="image/svg+xml" href="bandup-icon.svg"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=8"></head>
<body><main><h1>Bandup</h1><section class="card auth-card"><h2 data-i="ownerTitle"></h2><p class="tag" data-i="ownerIntro"></p><form id="owner-form"><label for="owner-key" data-i="ownerKey"></label><input id="owner-key" type="password" autocomplete="current-password" required><label for="admin-name" data-i="adminName"></label><input id="admin-name" minlength="2" maxlength="20" autocomplete="off" required><label for="admin-password" data-i="password"></label><input id="admin-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><p id="status" class="auth-error" role="alert" aria-live="polite"></p><button class="btn" id="create" type="submit" data-i="createAdmin"></button></form><p><a href="login.html" data-i="adminLogin"></a></p></section></main>
<script src="i18n2.js?v=5"></script><script src="i18n3.js?v=5"></script><script src="app.js?v=10"></script><script>
const form=document.getElementById("owner-form"),status=document.getElementById("status"),button=document.getElementById("create");
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;status.textContent="";try{await api("/api/owner/admins",{method:"POST",body:JSON.stringify({ownerKey:document.getElementById("owner-key").value,name:document.getElementById("admin-name").value,password:document.getElementById("admin-password").value})});form.reset();status.className="tag";status.textContent=t("adminCreated")}catch(error){status.className="auth-error";status.textContent=error.message||t("authError")}finally{button.disabled=false}};
</script></body></html>
