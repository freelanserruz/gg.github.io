<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subway Surfers · Bandup</title><link rel="icon" type="image/svg+xml" href="bandup-icon.svg"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=6"></head><body><main><p><a href="games.html" data-i="games"></a></p><h1 data-i="runnerTitle"></h1><p class="tag runner-help" data-i="runnerInstructions"></p><section class="runner-panel"><div class="runner-hud"><span><span data-i="runnerScore"></span>: <b id="score">0</b></span><span><span data-i="runnerTokens"></span>: <b id="tokens">0</b></span></div><canvas class="runner-canvas" id="game" width="820" height="440" aria-label="Metro Runner game"></canvas><p class="runner-status" id="status" aria-live="polite"></p><div class="runner-controls"><button class="btn" data-control="left" aria-label="Move left">←</button><button class="btn" data-control="jump" data-i="runnerJump"></button><button class="btn" data-control="slide" data-i="runnerSlide"></button><button class="btn" data-control="right" aria-label="Move right">→</button></div><div class="runner-controls"><button class="btn" id="start"></button><button class="btn ghost" id="pause"></button><button class="btn ghost" id="again"></button></div></section></main><script src="i18n2.js?v=5"></script><script src="i18n3.js?v=5"></script><script src="app.js?v=8"></script><script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),tokensEl=document.getElementById("tokens"),statusEl=document.getElementById("status");
let running=false,paused=false,over=false,lane=1,score=0,tokens=0,speed=205,spawnIn=0,last=0,jumpUntil=0,slideUntil=0,items=[];
document.getElementById("start").textContent=t("runnerStart");document.getElementById("pause").textContent=t("runnerPause");document.getElementById("again").textContent=t("again");
const centerAt=y=>410+(y-110)*.2, laneX=(l,y)=>centerAt(y)+(l-1)*(40+(y-110)*.8);
function paint(){const g=ctx;g.clearRect(0,0,820,440);const sky=g.createLinearGradient(0,0,0,440);sky.addColorStop(0,"#6f8fb3");sky.addColorStop(.42,"#d5a77b");sky.addColorStop(1,"#243750");g.fillStyle=sky;g.fillRect(0,0,820,440);
g.fillStyle="#26364c";for(let i=0;i<10;i++){const x=i*93+(i%2)*15,h=45+(i*31)%80;g.fillRect(x,105-h,62,h);g.fillStyle="#f6d58a";for(let y=120-h;y<96;y+=19)g.fillRect(x+12,y,7,9);g.fillStyle="#26364c"}
g.fillStyle="#384a5c";g.beginPath();g.moveTo(350,112);g.lineTo(470,112);g.lineTo(745,440);g.lineTo(75,440);g.closePath();g.fill();g.strokeStyle="#d3d7dc";g.lineWidth=5;g.beginPath();g.moveTo(350,112);g.lineTo(75,440);g.moveTo(470,112);g.lineTo(745,440);g.stroke();
for(let i=0;i<=3;i++){const xt=350+i*40,xb=75+i*223;g.strokeStyle=i===0||i===3?"#f5b84b":"rgba(239,246,255,.45)";g.lineWidth=i===0||i===3?3:2;g.beginPath();g.moveTo(xt,112);g.lineTo(xb,440);g.stroke()}
g.strokeStyle="rgba(240,245,248,.3)";g.lineWidth=2;for(let y=145;y<440;y+=34+(y-145)*.1){g.beginPath();g.moveTo(centerAt(y)-((y-110)*1.02),y);g.lineTo(centerAt(y)+((y-110)*1.02),y);g.stroke()}
for(const it of items){const x=laneX(it.lane,it.y),sz=16+(it.y-110)*.085;if(it.type==="token"){g.fillStyle="#ffd166";g.beginPath();g.arc(x,it.y,sz*.55,0,Math.PI*2);g.fill();g.strokeStyle="#fff0b2";g.lineWidth=3;g.stroke()}else{g.fillStyle=it.type==="bar"?"#f06b69":"#37c6b5";g.fillRect(x-sz,it.y-sz,sz*2,sz);g.fillStyle="rgba(255,255,255,.32)";g.fillRect(x-sz+4,it.y-sz+4,sz*2-8,5)}}
const baseY=344,px=laneX(lane,baseY),isJump=performance.now()<jumpUntil,isSlide=performance.now()<slideUntil,cy=isJump?baseY-72:baseY;g.save();g.translate(px,cy);g.fillStyle="rgba(0,0,0,.28)";g.beginPath();g.ellipse(0,23,isJump?24:31,8,0,0,Math.PI*2);g.fill();g.fillStyle="#f7cb9a";g.beginPath();g.arc(0,isSlide?4:-18,13,0,Math.PI*2);g.fill();g.fillStyle="#f06b69";if(isSlide)g.fillRect(-25,0,52,16);else g.fillRect(-15,-4,30,39);g.fillStyle="#183451";if(!isSlide){g.fillRect(-11,29,8,22);g.fillRect(4,29,8,22)}g.fillStyle="#f7cb9a";g.fillRect(-23,4,9,7);g.fillRect(14,4,9,7);g.restore();
}
function endGame(){running=false;over=true;statusEl.textContent=t("runnerOver",{score:Math.floor(score),tokens})+" "+t("gameNoPoints");document.getElementById("start").textContent=t("again")}
function frame(now){if(running&&!paused){const dt=Math.min((now-last)/1000,.05);last=now;score+=dt*10;spawnIn-=dt;if(spawnIn<=0){const laneN=Math.floor(Math.random()*3),r=Math.random();items.push({lane:laneN,y:112,type:r<.35?"token":r<.68?"block":"bar"});spawnIn=Math.max(.42,.95-score/1800)}for(const it of items)it.y+=speed*dt;
for(const it of items){if(it.type==="token"&&it.y>325&&it.y<355&&it.lane===lane){it.type="taken";tokens++;score+=25}if((it.type==="block"||it.type==="bar")&&it.y>326&&it.y<355&&it.lane===lane){const safe=it.type==="block"?now<jumpUntil:now<slideUntil;if(!safe){paint();return endGame()}}}items=items.filter(it=>it.y<455&&it.type!=="taken");speed=Math.min(330,205+score/50);scoreEl.textContent=Math.floor(score);tokensEl.textContent=tokens}
paint();requestAnimationFrame(frame)}
function begin(){running=true;paused=false;over=false;lane=1;score=0;tokens=0;speed=205;spawnIn=.6;last=performance.now();jumpUntil=slideUntil=0;items=[];statusEl.textContent="";scoreEl.textContent="0";tokensEl.textContent="0";document.getElementById("start").textContent=t("runnerStart");requestAnimationFrame(frame)}
function control(c){if(!running||paused)return;if(c==="left")lane=Math.max(0,lane-1);if(c==="right")lane=Math.min(2,lane+1);if(c==="jump")jumpUntil=performance.now()+650;if(c==="slide")slideUntil=performance.now()+650}
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k))e.preventDefault();if(k==="arrowleft"||k==="a")control("left");if(k==="arrowright"||k==="d")control("right");if(k==="arrowup"||k==="w"||k===" ")control("jump");if(k==="arrowdown"||k==="s")control("slide")});document.querySelectorAll("[data-control]").forEach(b=>b.onclick=()=>control(b.dataset.control));
document.getElementById("start").onclick=()=>over||!running?begin():null;document.getElementById("again").onclick=begin;document.getElementById("pause").onclick=()=>{if(!running)return;paused=!paused;document.getElementById("pause").textContent=paused?t("runnerResume"):t("runnerPause");if(!paused)last=performance.now()};paint();
</script></body></html>
