<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandup</title><link rel="icon" type="image/svg+xml" href="bandup-icon.svg"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><main><h2 id="title"></h2><div class="card" id="content"></div></main><script src="i18n2.js?v=5"></script><script src="i18n3.js?v=5"></script><script src="app.js?v=7"></script><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const u=me(),flow=ls("ep_flow",null),title=document.getElementById("title"),content=document.getElementById("content");
title.textContent=t("profile");
if(!u){content.innerHTML="<p>"+t("loginFirst")+'</p><a class="btn" href="login.html">'+t("login")+"</a>"}
else{
const active=flow&&flow.bank?flow:null;
let course=t("profileNoCourse"),status=t("profileNone"),details="",href="start.html",action=t("startb");
if(active&&active.bank==="english"){
course=t("profileEnglish");action=active.phase==="lesson"||active.phase==="plan"?t("continueb"):t("startb");
if(active.phase==="lesson"){
const n=Math.min(10,Math.max(1,Number(active.lessonNo)||1));
status=t("profileLessonNow",{n});details='<p>'+t("profileLessonsDone",{n:n-1})+'</p><p>'+t("profileLessonsLeft",{n:10-n})+'</p><progress max="10" value="'+(n-1)+'" aria-label="'+t("profileProgress")+'"></progress>';
}else if(active.phase==="plan"&&active.d&&active.d.o&&active.d.o.length){status=t("profileBeforeLesson");details='<p>'+t("profileLessonsLeft",{n:10})+'</p>'}
else status=t("profileDiag");
}else if(active&&active.bank==="ielts"){
course=t("profileIELTS")+(active.ans&&active.ans.format?" · "+(active.ans.format==="academic"?"Academic":"General Training"):"");status=active.phase==="plan"?t("profilePlan"):t("profileSurvey");href="start.html";action=t("startb");
}
content.innerHTML='<p class="tag">'+t("name")+'</p><h3>'+esc(u.name)+'</h3><hr><p class="tag">'+t("profileCourse")+'</p><h3>'+esc(course)+'</h3><p class="tag">'+t("profileStatus")+'</p><p>'+esc(status)+'</p>'+details+'<p><a class="btn" href="'+href+'">'+esc(action)+'</a></p>';
}
</script></body></html>
