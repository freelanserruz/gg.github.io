<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandup</title><link rel="icon" type="image/svg+xml" href="bandup-icon.svg"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=7"></head><body><main><h2 data-i="rating"></h2><p class="tag" data-i="leaderboardLocalNote"></p><p id="status" class="tag" aria-live="polite"></p><div class="card"><table id="t"></table></div></main><script src="i18n2.js?v=5"></script><script src="i18n3.js?v=5"></script><script src="app.js?v=9"></script><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const table=document.getElementById("t"),status=document.getElementById("status");try{const {users}=await api("/api/leaderboard");table.innerHTML=users.length?"<tr><th>#</th><th>"+t("name")+"</th><th>"+t("pts")+"</th></tr>"+users.map((u,i)=>"<tr><td>"+(i+1)+"</td><td>"+esc(u.name)+"</td><td>"+Number(u.points||0)+"</td></tr>").join(""):"<tr><td>"+t("empty")+"</td></tr>";status.textContent=""}catch{status.textContent=t("saveError")}})();
</script></body></html>
